<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4THEPT 실사 기반 4:5 카드뉴스 &amp; 바이럴 키트 (18종)</title>
  <!--
  기능: 실제 4THEPT 화면 고해상도 스크린샷 기반 1080x1350 (4:5) PNG 카드뉴스 4대 테마(총 18장) + 원클릭 복붙 문구 키트
  구성:
    1) CHEAT_SHEET (5장): 인스타/네이버카페 저장·북마크 유도형 실무 SOAP 기록 예시 총정리 + 실사 캡처
    2) REAL_SCREEN (5장): 비포/애프터 실제 화면 직관 비교형 + 실사 캡처
    3) KAKAO_POSTER (3장): 카카오톡 단톡방/오픈채팅 1장 요약 실사 포스터
    4) CENTER_PACK (5장): 비의료 운동·트레이닝·PT 센터 전용 키트 (의료 표현 0건)
  규칙: 토스 비즈니스 UI 표준 (유니코드 이모지 배제, 타이포그래피 중심, [초안]·[직접 검수] 면책 고지 필수)
-->
  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --line: #e2e8f0;
      --ink: #0f172a;
      --sub: #475569;
      --mute: #94a3b8;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --blue-line: #bfdbfe;
      --amber-soft: #fffbeb;
      --amber-line: #fde68a;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-line: #a7f3d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-style: italic;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -.03em;
    }

    .badge-top {
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid var(--blue-line);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab,
    .btn {
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 9px 15px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--sub);
      cursor: pointer;
      transition: all .15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .tab:hover,
    .btn:hover {
      border-color: var(--blue-line);
      color: var(--ink);
    }

    .tab.on,
    .btn.primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .btn.primary:hover {
      background: #1d4ed8;
      color: #fff;
    }

    .btn.copied {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 24px 72px;
    }

    /* 원클릭 복붙 패널 */
    .copy-panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 28px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .panel-head h2 {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .panel-head p {
      font-size: 13px;
      color: var(--sub);
      margin-top: 3px;
    }

    .copy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .copy-card {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .copy-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .copy-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid var(--blue-line);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .copy-preview {
      font-size: 12px;
      line-height: 1.55;
      color: var(--sub);
      white-space: pre-line;
      max-height: 130px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }

    /* 카드뉴스 그리드 */
    .theme-head {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .theme-head h2 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.03em;
    }

    .theme-head p {
      font-size: 14px;
      color: var(--sub);
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .slot {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
    }

    .slot .view {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--line);
      position: relative;
    }

    .slot .view .card {
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    .slot .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 2px;
      font-size: 12px;
      font-weight: 800;
      color: var(--sub);
    }

    /* 1080x1350 (4:5 세로형) 카드 - 모바일 피드 가독성 기준 확대 */
    .card {
      width: 1080px;
      height: 1350px;
      background: #fff;
      padding: 46px 56px 40px;
      display: flex;
      flex-direction: column;
      font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
      color: var(--ink);
    }

    .card .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 26px;
      font-weight: 800;
      color: var(--mute);
    }

    .card .top .lg {
      font-style: italic;
      font-weight: 900;
      font-size: 38px;
      color: var(--ink);
      letter-spacing: -.03em;
    }

    .card .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card .tag {
      align-self: flex-start;
      padding: 10px 24px;
      border-radius: 999px;
      background: var(--blue-soft);
      border: 2px solid var(--blue-line);
      color: var(--blue);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .card .tag.green {
      background: var(--green-soft);
      border-color: var(--green-line);
      color: var(--green);
    }

    .card .tag.dark {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }

    .card h3 {
      font-size: 72px;
      line-height: 1.18;
      font-weight: 900;
      letter-spacing: -.04em;
      word-break: keep-all;
    }

    .card h3 em {
      font-style: normal;
      color: var(--blue);
    }

    .card p.desc {
      margin-top: 14px;
      font-size: 34px;
      line-height: 1.44;
      color: #334155;
      font-weight: 700;
      word-break: keep-all;
    }

    .card:has(.real-shot) h3,
    .card:has(.cheat-grid) h3,
    .card:has(.box) h3 {
      font-size: 58px;
      line-height: 1.18;
    }

    .card:has(.real-shot) p.desc,
    .card:has(.cheat-grid) p.desc,
    .card:has(.box) p.desc {
      font-size: 28px;
      line-height: 1.42;
      margin-top: 10px;
    }

    .card:has(.real-shot) .tag,
    .card:has(.cheat-grid) .tag,
    .card:has(.box) .tag {
      margin-bottom: 12px;
      font-size: 24px;
      padding: 8px 20px;
    }

    /* 2열 단어 끊김 방지를 위한 세로 풀폭 스택 */
    .card .box {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card .mini {
      border: 2px solid var(--line);
      border-radius: 22px;
      padding: 18px 24px;
      font-size: 27px;
      line-height: 1.42;
      color: #1e293b;
      background: #fff;
      font-weight: 700;
      word-break: keep-all;
    }

    .card .mini b {
      display: block;
      font-size: 26px;
      color: var(--sub);
      margin-bottom: 8px;
      font-weight: 900;
    }

    .card .mini.hl {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--ink);
    }

    .card .mini.hl b {
      color: var(--blue);
    }

    .card .mini .add {
      background: var(--amber-soft);
      border: 1px solid var(--amber-line);
      color: #92400e;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 800;
    }

    /* 실사 스크린샷 + 2배 확대 콜아웃 프레임 */
    .real-shot {
      margin-top: 16px;
      background: #f8fafc;
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, .08);
      overflow: hidden;
    }

    .zoom-callout {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 2px solid #3b82f6;
    }

    .zoom-callout-badge {
      background: #2563eb;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .zoom-callout-text {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.35;
      color: #f8fafc;
      word-break: keep-all;
    }

    .real-shot img {
      display: block;
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      object-position: top center;
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    .card:has(.benefit-strip) .real-shot img,
    .card:has(.foot-last) .real-shot img {
      max-height: 415px;
    }

    .real-shot-cap {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
      font-size: 23px;
      font-weight: 800;
      color: var(--ink);
    }

    .real-shot-cap span.pill {
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid var(--blue-line);
      padding: 5px 14px;
      border-radius: 10px;
      font-size: 21px;
      white-space: nowrap;
    }

    /* 저장용 치트시트 그리드 */
    .cheat-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .cheat-card {
      background: #f8fafc;
      border: 2px solid var(--line);
      border-radius: 22px;
      padding: 20px 22px;
    }

    .cheat-card.accent {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .cheat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 28px;
      font-weight: 900;
      color: var(--ink);
    }

    .cheat-head span {
      font-size: 21px;
      font-weight: 900;
      color: var(--blue);
      background: #fff;
      border: 2px solid var(--blue-line);
      padding: 4px 12px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .cheat-kw {
      font-size: 25px;
      font-weight: 800;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 10px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .cheat-out {
      font-size: 24px;
      font-weight: 700;
      color: #334155;
      line-height: 1.42;
      word-break: keep-all;
    }

    .cheat-out strong {
      color: var(--blue);
      font-weight: 900;
    }

    .benefit-strip {
      margin-top: 16px;
      background: #0f172a;
      border-radius: 20px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: #fff;
    }

    .benefit-strip .b-title {
      font-size: 29px;
      font-weight: 900;
      color: #fff;
    }

    .benefit-strip .b-sub {
      font-size: 23px;
      font-weight: 700;
      color: #93c5fd;
      margin-top: 4px;
    }

    .benefit-pill {
      background: var(--blue);
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      padding: 12px 22px;
      border-radius: 14px;
      white-space: nowrap;
    }

    .card .foot-last {
      font-size: 24px;
      font-weight: 700;
      background: #f8fafc;
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 15px 22px;
      line-height: 1.42;
      color: #1e293b;
      margin-top: 14px;
      word-break: keep-all;
    }

    .card .card-foot-notice {
      margin-top: auto;
      font-size: 21px;
      color: #64748b;
      line-height: 1.42;
      border-top: 2px solid var(--line);
      padding-top: 14px;
      font-weight: 700;
      word-break: keep-all;
    }
  </style>
</head>

<body>
<header>
  <div class="brand-wrap">
    <div class="logo">4THEPT</div>
    <span class="badge-top">실사 화면 탑재 · 4:5 18종 카드뉴스 키트</span>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="CHEAT_SHEET">저장 유도 치트시트 (5장)</button>
    <button class="tab" data-t="REAL_SCREEN">실제 화면 비포/애프터 (5장)</button>
    <button class="tab" data-t="KAKAO_POSTER">카톡 1장 요약 포스터 (3장)</button>
    <button class="tab" data-t="CENTER_PACK">트레이너·PT센터 전용 키트 (5장)</button>
    <a href="promo_master_hub.html" class="tab" style="background:#0f172a;color:#fff;border-color:#0f172a;">올인원 홍보 마스터 허브 ➔</a>
  </div>
  <button class="btn primary" id="dlAll">현재 테마 전체 PNG 저장</button>
</header>

  <main>
    <section class="copy-panel">
      <div class="panel-head">
        <div>
          <h2>무반응 돌파용 원클릭 복붙 문구집 (정보글 위장 · 저장 유도형)</h2>
          <p>노골적인 광고 문구 대신 "실무 기록지 예시 / 치트시트 공유" 문구와 실제 작동 화면을 함께 올리세요.</p>
        </div>
      </div>
      <div class="copy-grid" id="copyGrid"></div>
    </section>

    <div class="theme-head">
      <div>
        <h2 id="th"></h2>
        <p id="tp"></p>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const URL_SITE = 'https://www.4thept.com/intro';

    const COPY_TEMPLATES = [
      {
        id: 'cafe_cheatsheet',
        tag: '네이버 카페 · 블로그 정보 공유형 (추천 1순위)',
        title: '광고 거부감 0% 실무 치트시트 공유 글',
        text: `[도수·운동치료 EMR 기록지 자주 쓰는 부위별 예시 4종 정리해 뒀습니다]
신규 환자나 바쁜 날 퇴근 전에 SOAP 차트 문장 다듬느라 30~40분씩 걸리길래, 제가 자주 쓰는 발목·경추·요추·회전근개 4부위 5단락 양식을 저장용으로 묶어 봤습니다.

1) 발목·족부 : 부종 감소, plantar flexion 30도, 발꿈치들기 운동, NRS 5->2
2) 경추·어깨 : 승모근·견갑거근 단축, 회전 ROM 제한, 후두하근 이완, NRS 6->3
3) 요추·골반 : L4-5 기립근 과긴장, 장요근 이완·코어 안정화, NRS 5->2
4) 회전근개 : rt sh flex 120도 제한, Neer (+), 극상근 이완, NRS 5->3

매번 문장 치기 귀찮을 때는 아래 링크에서 키워드 1줄만 직접 수정해서 5초 만에 표준 EMR 양식 [초안]으로 변환해 복붙 쓰고 있습니다. 로그인 없이 바로 타이핑 테스트도 되니 저장해두고 써보세요.

실제 테스트해 보기: ${URL_SITE}`
      },
      {
        id: 'kakao_colleague',
        tag: '카톡 · 병원 치료실 동료 단톡방 추천형',
        title: '친근한 실무 팁 공유용',
        text: `선생님들 오늘 도수 차팅 밀리셨으면 이거 한 번 직접 쳐보세요.
발목/어깨/허리 메모하듯 단어 5개(예: 오른쪽 발 통증, 발꿈치들기, plantar flexion 30도, NRS 5->2)만 적으면 5초 만에 병원 EMR 복붙용 치료기록지 [초안] 형식으로 정리됩니다.

- 로그인 없이 링크에서 바로 내 환자 키워드 직접 수정 체험 가능
- 구글 로그인 후 매월 120건(120분) 무료 · THEPT 회원은 월 300건 무료
- 10초 직접 검수 후 [EMR 양식 복사] 클릭하면 바로 복붙 완료

무료 체험 페이지: ${URL_SITE}`
      },
      {
        id: 'kakao_openchat',

    let cur = 'CHEAT_SHEET';

    function renderCopyCards() {
      const grid = document.getElementById('copyGrid');
      grid.innerHTML = '';
      COPY_TEMPLATES.forEach((item) => {
        const el = document.createElement('div');
        el.className = 'copy-card';
        el.innerHTML = `
      <div>
        <div class="copy-card-top">
          <span class="copy-tag">${item.tag}</span>
          <button type="button" class="btn" data-copy-id="${item.id}" style="padding:5px 10px; font-size:11px;">문구 복사</button>
        </div>
        <div style="font-size:13px; font-weight:800; color:var(--ink); margin:8px 0 6px;">${item.title}</div>
        <div class="copy-preview">${item.text}</div>
      </div>
    `;
        grid.appendChild(el);
      });

      grid.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-copy-id]');
        if (!btn) return;
        const item = COPY_TEMPLATES.find((x) => x.id === btn.dataset.copyId);
        if (!item) return;
        try {
          await navigator.clipboard.writeText(item.text);
          const orig = btn.textContent;
          btn.textContent = '복사 완료';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = orig;
            btn.classList.remove('copied');
          }, 2200);
        } catch {
          alert('복사에 실패했습니다. 미리보기 박스에서 직접 복사해 주세요.');
        }
      });
    }

    function cardHtml(c, i, n, themeKey) {
      const activeTheme = themeKey || cur;
      const footNotice = activeTheme === 'CENTER_PACK' ? FOOT_NOTICE_CENTER : FOOT_NOTICE;
      const bodyExtra = c.html
        ? c.html
        : c.box
          ? '<div class="box">' + c.box.map((b, k) => '<div class="mini' + (k ? ' hl' : '') + '"><b>' + b[0] + '</b>' + b[1] + '</div>').join('') + '</div>'
          : '';
      const benefit = c.benefit ? BENEFIT_HTML : '';
      const extra = c.lastNotice ? '<div class="foot-last">' + c.lastNotice + '</div>' : '';
      const tagCls = c.tagClass ? 'tag ' + c.tagClass : 'tag';

      return '<div class="card">'
        + '<div class="top"><span class="lg">4THEPT</span><span>' + (i + 1) + ' / ' + n + '</span></div>'
        + '<div class="body"><span class="' + tagCls + '">' + c.tag + '</span><h3>' + c.h + '</h3><p class="desc">' + c.d + '</p>' + bodyExtra + benefit + extra + '</div>'
        + '<div class="card-foot-notice">' + footNotice + '</div>'
        + '</div>';
    }

    function render() {
      const T = THEMES[cur];
      document.getElementById('th').textContent = T.title;
      document.getElementById('tp').textContent = T.sub;
      const g = document.getElementById('grid');
      g.innerHTML = '';
      T.cards.forEach((c, i) => {
        const s = document.createElement('div');
        s.className = 'slot';
        s.innerHTML = '<div class="view">' + cardHtml(c, i, T.cards.length, cur) + '</div>'
          + '<div class="bar"><span>카드 ' + (i + 1) + '</span><button class="btn" data-i="' + i + '">PNG 저장 (1080x1350)</button></div>';
        g.appendChild(s);
      });
      fit();
    }

    function fit() {
      document.querySelectorAll('.view').forEach((v) => {
        const k = v.clientWidth / 1080;
        v.querySelector('.card').style.transform = 'scale(' + k + ')';
      });
    }

    async function save(i) {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      const T = THEMES[cur];
      const tmp = document.createElement('div');
      tmp.style.cssText = 'position:fixed; left:-9999px; top:0;';
      tmp.innerHTML = cardHtml(T.cards[i], i, T.cards.length, cur);
      document.body.appendChild(tmp);
      const imgs = Array.from(tmp.querySelectorAll('img'));
      await Promise.all(imgs.map((img) => img.complete ? Promise.resolve() : new Promise((res) => { img.onload = res; img.onerror = res; })));
      const cv = await html2canvas(tmp.firstChild, { scale: 1, backgroundColor: '#ffffff', useCORS: location.protocol.startsWith('http') });
      const a = document.createElement('a');
      a.download = '4thept_pt_' + cur.toLowerCase() + '_' + (i + 1) + '.png';
      a.href = cv.toDataURL('image/png');
      a.click();
      tmp.remove();
    }

    document.getElementById('grid').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (b) save(+b.dataset.i);
    });

    document.getElementById('dlAll').onclick = async () => {
      for (let i = 0; i < THEMES[cur].cards.length; i++) {
        await save(i);
        await new Promise((r) => setTimeout(r, 320));
      }
    };

    document.querySelectorAll('.tab[data-t]').forEach((t) => {
      t.onclick = () => {
        document.querySelectorAll('.tab[data-t]').forEach((x) => x.classList.remove('on'));
        t.classList.add('on');
        cur = t.dataset.t;
        render();
      };
    });

    window.addEventListener('resize', fit);
    renderCopyCards();
    render();
  </script>
