<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Instagram Card News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1080px; /* 1:1 정방형 인스타 규격 */
      background: #f8fafc;
      color: #0f172a;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 배경 장식 요소 (인스타 감성 소프트 그라디언트) */
    .bg-circle-1 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(14, 165, 233, 0) 70%);
      top: -100px;
      right: -80px;
      border-radius: 50%;
      z-index: 0;
    }

    .bg-circle-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.09) 0%, rgba(99, 102, 241, 0) 70%);
      bottom: -80px;
      left: -80px;
      border-radius: 50%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 1080px;
      height: 1080px;
      padding: 64px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. 상단 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: #0284c7;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 20px;
      color: #1e293b;
      letter-spacing: -0.3px;
    }

    .week-pill {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 700;
    }

    /* 2. 메인 컨텐츠 영역 */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 0;
    }

    /* [표지 슬라이드] */
    .cover-category-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 24px;
      width: fit-content;
    }

    .cover-main-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.28;
      letter-spacing: -1.8px;
      color: #0f172a;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .cover-sub-box {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 24px 30px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .cover-sub-text {
      font-size: 22px;
      font-weight: 600;
      color: #475569;
      line-height: 1.5;
    }

    .cover-teaser-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cover-teaser-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
    }

    .cover-teaser-num {
      background: #0ea5e9;
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
    }

    /* [본문 뉴스 슬라이드] */
    .news-header-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .news-num-badge {
      background: #0f172a;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 20px;
      padding: 6px 14px;
      border-radius: 10px;
    }

    .news-cat-pill {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 800;
    }

    .news-source-tag {
      font-size: 17px;
      font-weight: 600;
      color: #64748b;
    }

    .news-title-text {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: -1.2px;
      color: #0f172a;
      margin-bottom: 26px;
      word-break: keep-all;
    }

    .news-content-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 30px 32px;
      margin-bottom: 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .news-sentence {
      font-size: 23px;
      line-height: 1.65;
      color: #334155;
      font-weight: 600;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .news-sentence:last-child {
      margin-bottom: 0;
    }

    .news-highlight-box {
      background: #f0f9ff;
      border: 1.5px solid #0284c7;
      border-radius: 16px;
      padding: 22px 28px;
      font-size: 22px;
      font-weight: 800;
      color: #0369a1;
      line-height: 1.5;
      word-break: keep-all;
    }

    /* [인사이트 슬라이드] */
    .insight-badge {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      width: fit-content;
    }

    .insight-heading {
      font-size: 44px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.35;
      letter-spacing: -1px;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .insight-box {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 28px 32px;
      font-size: 24px;
      line-height: 1.6;
      color: #334155;
      font-weight: 600;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      word-break: keep-all;
    }

    .check-list-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .check-card {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 21px;
      font-weight: 700;
      color: #1e293b;
    }

    /* [아웃트로 슬라이드] */
    .outro-wrap {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 28px;
      padding: 44px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .outro-top-pill {
      background: #0ea5e9;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }

    .outro-main-msg {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.35;
      color: #0f172a;
      letter-spacing: -1px;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .outro-sub-msg {
      font-size: 24px;
      color: #64748b;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 36px;
      word-break: keep-all;
    }

    /* 인스타 실제 액션 버튼 4개 UI */
    .insta-actions-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
      margin-bottom: 28px;
    }

    .insta-btn {
      flex: 1;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      padding: 16px 12px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 800;
      color: #1e293b;
    }

    .insta-btn.save-highlight {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    .insta-btn-icon {
      font-size: 26px;
    }

    .account-follow-box {
      font-size: 20px;
      font-weight: 800;
      color: #0284c7;
    }

    /* 3. 하단 네비게이션 바 (인스타 캐러셀 전용) */
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid #e2e8f0;
      padding-top: 20px;
    }

    .nav-handle {
      font-weight: 700;
      font-size: 18px;
      color: #94a3b8;
    }

    /* 캐러셀 인디케이터 점 (● ○ ○ ○ ○ ○) */
    .carousel-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cbd5e1;
    }

    .dot.active {
      width: 24px;
      height: 10px;
      border-radius: 9999px;
      background: #0284c7;
    }

    .nav-swipe-prompt {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 18px;
      font-weight: 800;
      color: #0284c7;
    }
  </style>
</head>
<body>
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>

  <div class="container">
    <!-- 상단 바 -->
    <div class="top-bar">
      <div class="brand-box">
        <div class="brand-badge">PT BRIEF</div>
        <div class="brand-name">물리치료 매거진</div>
      </div>
      <div class="week-pill">{{HEADER_TAG}}</div>
    </div>

    <!-- 본문 내용 동적 주입 -->
    <div class="main-body">
      {{BODY_CONTENT}}
    </div>

    <!-- 하단 인스타그램 네비게이션 바 -->
    <div class="bottom-nav">
      <div class="nav-handle">@pt_weekly_brief</div>
      <div class="carousel-dots">
        {{CAROUSEL_DOTS}}
      </div>
      <div class="nav-swipe-prompt">
        <span>{{SWIPE_LABEL}}</span>
      </div>
    </div>
  </div>
</body>
</html>
