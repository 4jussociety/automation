<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>THEPT Instagram Feed Card (4:5)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px; /* 인스타그램 피드 4:5 최적 규격 */
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #0b0f19;
    }

    .bg-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      background-image: url('{{BACKGROUND_IMAGE_DATA}}');
      background-size: cover;
      background-position: center;
      z-index: 0;
      filter: blur(2.5px) brightness(0.85);
      transform: scale(1.04);
    }

    .bg-overlay-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      background: linear-gradient(
        180deg, 
        rgba(11, 15, 25, 0.88) 0%, 
        rgba(11, 15, 25, 0.65) 30%, 
        rgba(11, 15, 25, 0.60) 60%, 
        rgba(11, 15, 25, 0.86) 85%, 
        rgba(11, 15, 25, 0.95) 100%
      );
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 1080px;
      height: 1350px;
      padding: 65px 70px 55px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. 상단 바 (THEPT 로고 탑재) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 26px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .thept-logo-img {
      height: 84px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.7));
    }

    .brand-sub {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #e2e8f0;
      border-left: 3.5px solid rgba(255, 255, 255, 0.4);
      padding-left: 22px;
    }

    .category-pill {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 12px 32px;
      border-radius: 9999px;
      font-size: 32px;
      font-weight: 800;
      backdrop-filter: blur(16px);
    }

    /* 2. 중앙 메인 컨텐츠 영역 */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 0;
    }

    /* [표지 슬라이드] */
    .cover-tag-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(250, 204, 21, 0.2);
      border: 2px solid #facc15;
      color: #facc15;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 24px;
      width: fit-content;
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.25);
    }

    .cover-huge-title {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.26;
      letter-spacing: -2px;
      color: #ffffff;
      margin-bottom: 26px;
      word-break: keep-all;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .hl-yellow {
      color: #facc15;
      text-shadow: 0 0 25px rgba(250, 204, 21, 0.4);
    }

    .cover-desc-card {
      background: rgba(15, 23, 42, 0.86);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 22px;
      padding: 26px 34px;
      margin-bottom: 26px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
    }

    .cover-desc-text {
      font-size: 27px;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1.5;
      word-break: keep-all;
    }

    .cover-item-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cover-item-row {
      background: rgba(15, 23, 42, 0.82);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.4;
      word-break: keep-all;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .cover-num-bullet {
      background: #facc15;
      color: #000000;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* [뉴스 본문 슬라이드] */
    .news-top-badge-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .news-index-badge {
      background: #facc15;
      color: #000000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 24px;
      padding: 6px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(250, 204, 21, 0.3);
    }

    .news-category-badge {
      background: rgba(56, 189, 248, 0.22);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      padding: 7px 18px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 800;
    }

    .news-source-badge {
      color: #cbd5e1;
      font-size: 20px;
      font-weight: 700;
    }

    .news-main-headline {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.32;
      letter-spacing: -1.6px;
      color: #ffffff;
      margin-bottom: 22px;
      word-break: keep-all;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.75);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-height: 2.7em;
    }

    .news-glass-box {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 28px 34px;
      margin-bottom: 22px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    .news-body-bullet {
      font-size: 29px;
      line-height: 1.52;
      color: #f1f5f9;
      font-weight: 600;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .news-body-bullet:last-child {
      margin-bottom: 0;
    }

    .news-action-highlight {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.24) 0%, rgba(234, 179, 8, 0.12) 100%);
      border: 2px solid #facc15;
      border-radius: 20px;
      padding: 22px 30px;
      font-size: 27px;
      font-weight: 800;
      color: #fef08a;
      line-height: 1.48;
      word-break: keep-all;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    /* [인사이트 슬라이드] */
    .insight-top-tag {
      background: rgba(56, 189, 248, 0.22);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 22px;
      width: fit-content;
    }

    .insight-huge-title {
      font-size: 54px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.3;
      letter-spacing: -1.5px;
      margin-bottom: 26px;
      word-break: keep-all;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .insight-summary-card {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 22px;
      padding: 30px 36px;
      font-size: 29px;
      line-height: 1.6;
      color: #f1f5f9;
      font-weight: 600;
      margin-bottom: 26px;
      backdrop-filter: blur(20px);
      word-break: keep-all;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .insight-checklist {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .insight-check-item {
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 27px;
      font-weight: 800;
      color: #f8fafc;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    /* [아웃트로 슬라이드] */
    .outro-card-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2.5px solid rgba(250, 204, 21, 0.6);
      border-radius: 32px;
      padding: 48px 40px;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .outro-header-text {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.32;
      color: #ffffff;
      margin-bottom: 18px;
      word-break: keep-all;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .outro-sub-text {
      font-size: 27px;
      color: #cbd5e1;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 34px;
      word-break: keep-all;
    }

    .outro-insta-buttons {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-bottom: 32px;
    }

    .insta-button {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 20px 14px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      backdrop-filter: blur(12px);
    }

    .insta-button.highlight-save {
      background: rgba(250, 204, 21, 0.25);
      border-color: #facc15;
      color: #fef08a;
    }

    .btn-icon {
      font-size: 32px;
    }

    /* 아웃트로 하단 공식 채널 연동 카드 (인스타, 유튜브, 홈) */
    .channels-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .channel-link-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
    }

    .channel-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3. 하단 네비게이션 바 (2단 개편: 채널 바 상단 + 액션 바 최하단) */
    .bottom-nav {
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      padding-top: 24px;
    }

    /* 1행: 채널 3종 바 (한 줄 꽉 차게 균등 분할) */
    .footer-channels-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 10px;
    }

    .footer-channel-badge {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      padding: 16px 6px;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .footer-channel-badge span {
      font-size: 33px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.8px;
      white-space: nowrap;
    }

    .footer-icon-svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .footer-icon-stroke {
      width: 36px;
      height: 36px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      flex-shrink: 0;
    }

    /* 2행: 최하단 인디케이터 및 스와이프 액션 (인디케이터 점 중앙 정렬) */
    .footer-bottom-action-bar {
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      min-height: 48px;
      padding: 0 4px;
    }

    .carousel-dots {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .dot.active {
      width: 44px;
      height: 15px;
      border-radius: 9999px;
      background: #facc15;
      box-shadow: 0 0 14px #facc15;
    }

    .swipe-action-text {
      font-size: 32px;
      font-weight: 900;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="bg-image-layer"></div>
  <div class="bg-overlay-gradient"></div>

  <div class="container">
    <!-- 상단 바 -->
    <div class="top-bar">
      <div class="brand-wrap">
        <img src="{{LOGO_DATA}}" class="thept-logo-img" alt="THEPT Logo" />
        <div class="brand-sub">물리치료 LAB</div>
      </div>
      <div class="category-pill">{{HEADER_TAG}}</div>
    </div>

    <!-- 중앙 본문 슬라이드 -->
    <div class="main-body">
      {{BODY_CONTENT}}
    </div>

    <!-- 하단 네비게이션 바 (2단 구성: 채널 바 상단 + 액션 바 최하단) -->
    <div class="bottom-nav">
      <!-- 1행: 채널 3종 바 (한 줄 꽉 차게) -->
      <div class="footer-channels-bar">
        <!-- 인스타그램 -->
        <div class="footer-channel-badge">
          <svg class="footer-icon-stroke" viewBox="0 0 24 24" style="color: #f43f5e;">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>@teamthept</span>
        </div>
        <!-- 유튜브 -->
        <div class="footer-channel-badge">
          <svg class="footer-icon-svg" viewBox="0 0 24 24" style="color: #ef4444;">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span>더피티THEPT</span>
        </div>
        <!-- 홈페이지 -->
        <div class="footer-channel-badge">
          <svg class="footer-icon-stroke" viewBox="0 0 24 24" style="color: #38bdf8;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>thept.co.kr</span>
        </div>
      </div>

      <!-- 2행: 최하단 인디케이터 및 스와이프 액션 -->
      <div class="footer-bottom-action-bar">
        <div class="carousel-dots">
          {{CAROUSEL_DOTS}}
        </div>
        <div class="swipe-action-text">
          <span>{{SWIPE_LABEL}}</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
