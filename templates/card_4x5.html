<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>THEPT Instagram Feed Card (4:5)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px; /* 인스타그램 피드 4:5 최적 규격 */
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #0b0f19;
    }

    .bg-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      background-image: url('{{BACKGROUND_IMAGE_DATA}}');
      background-size: cover;
      background-position: center;
      z-index: 0;
      filter: brightness(0.8);
    }

    .bg-overlay-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      background: linear-gradient(
        180deg, 
        rgba(11, 15, 25, 0.94) 0%, 
        rgba(11, 15, 25, 0.76) 30%, 
        rgba(11, 15, 25, 0.72) 60%, 
        rgba(11, 15, 25, 0.92) 85%, 
        rgba(11, 15, 25, 0.98) 100%
      );
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 1080px;
      height: 1350px;
      padding: 65px 70px 55px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. 상단 바 (THEPT 로고 탑재) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 20px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .thept-logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }

    .brand-sub {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #94a3b8;
      border-left: 1.5px solid rgba(255, 255, 255, 0.2);
      padding-left: 14px;
    }

    .category-pill {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 6px 18px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    /* 2. 중앙 메인 컨텐츠 영역 */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 0;
    }

    /* [표지 슬라이드] */
    .cover-tag-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(250, 204, 21, 0.15);
      border: 1.5px solid #facc15;
      color: #facc15;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 24px;
      width: fit-content;
    }

    .cover-huge-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.28;
      letter-spacing: -1.8px;
      color: #ffffff;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .hl-yellow {
      color: #facc15;
    }

    .cover-desc-card {
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 24px 30px;
      margin-bottom: 26px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .cover-desc-text {
      font-size: 22px;
      font-weight: 600;
      color: #cbd5e1;
      line-height: 1.55;
      word-break: keep-all;
    }

    .cover-item-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cover-item-row {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      backdrop-filter: blur(12px);
    }

    .cover-num-bullet {
      background: #facc15;
      color: #000000;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* [뉴스 본문 슬라이드] */
    .news-top-badge-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .news-index-badge {
      background: #facc15;
      color: #000000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 20px;
      padding: 5px 14px;
      border-radius: 10px;
    }

    .news-category-badge {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 800;
    }

    .news-source-badge {
      color: #94a3b8;
      font-size: 17px;
      font-weight: 600;
    }

    .news-main-headline {
      font-size: 45px;
      font-weight: 900;
      line-height: 1.34;
      letter-spacing: -1.3px;
      color: #ffffff;
      margin-bottom: 26px;
      word-break: keep-all;
    }

    .news-glass-box {
      background: rgba(15, 23, 42, 0.82);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 28px 32px;
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .news-body-bullet {
      font-size: 23px;
      line-height: 1.65;
      color: #e2e8f0;
      font-weight: 500;
      margin-bottom: 14px;
      word-break: keep-all;
    }

    .news-body-bullet:last-child {
      margin-bottom: 0;
    }

    .news-action-highlight {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.18) 0%, rgba(234, 179, 8, 0.08) 100%);
      border: 1.5px solid #facc15;
      border-radius: 16px;
      padding: 22px 28px;
      font-size: 22px;
      font-weight: 800;
      color: #fef08a;
      line-height: 1.5;
      word-break: keep-all;
    }

    /* [인사이트 슬라이드] */
    .insight-top-tag {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      width: fit-content;
    }

    .insight-huge-title {
      font-size: 45px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.34;
      letter-spacing: -1.2px;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .insight-summary-card {
      background: rgba(15, 23, 42, 0.82);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 26px 30px;
      font-size: 23px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      word-break: keep-all;
    }

    .insight-checklist {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .insight-check-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 21px;
      font-weight: 700;
      color: #f8fafc;
      backdrop-filter: blur(12px);
    }

    /* [아웃트로 슬라이드] */
    .outro-card-box {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(250, 204, 21, 0.5);
      border-radius: 28px;
      padding: 40px 36px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .outro-header-text {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .outro-sub-text {
      font-size: 22px;
      color: #94a3b8;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 30px;
      word-break: keep-all;
    }

    .outro-insta-buttons {
      display: flex;
      gap: 14px;
      width: 100%;
      margin-bottom: 28px;
    }

    .insta-button {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      padding: 16px 10px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      backdrop-filter: blur(10px);
    }

    .insta-button.highlight-save {
      background: rgba(250, 204, 21, 0.2);
      border-color: #facc15;
      color: #fef08a;
    }

    .btn-icon {
      font-size: 26px;
    }

    /* 아웃트로 하단 공식 채널 연동 카드 (인스타, 유튜브, 홈) */
    .channels-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .channel-link-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
    }

    .channel-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3. 하단 네비게이션 바 (채널 정보 3종 + 인디케이터/스와이프) */
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid rgba(255, 255, 255, 0.15);
      padding-top: 18px;
    }

    /* 인스타, 유튜브, 홈페이지 채널 3종 인포 그룹 */
    .footer-channels-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .footer-icon-svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .footer-icon-stroke {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .carousel-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
    }

    .dot.active {
      width: 24px;
      height: 9px;
      border-radius: 9999px;
      background: #facc15;
      box-shadow: 0 0 10px #facc15;
    }

    .swipe-action-text {
      font-size: 17px;
      font-weight: 900;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="bg-image-layer"></div>
  <div class="bg-overlay-gradient"></div>

  <div class="container">
    <!-- 상단 바 -->
    <div class="top-bar">
      <div class="brand-wrap">
        <img src="{{LOGO_DATA}}" class="thept-logo-img" alt="THEPT Logo" />
        <div class="brand-sub">물리치료 매거진</div>
      </div>
      <div class="category-pill">{{HEADER_TAG}}</div>
    </div>

    <!-- 중앙 본문 슬라이드 -->
    <div class="main-body">
      {{BODY_CONTENT}}
    </div>

    <!-- 하단 네비게이션 바 (인스타, 유튜브, 홈 3종 아이콘 탑재) -->
    <div class="bottom-nav">
      <div class="footer-channels-group">
        <!-- 인스타그램 -->
        <div class="footer-item">
          <svg class="footer-icon-stroke" viewBox="0 0 24 24">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>@teamthept</span>
        </div>
        <!-- 유튜브 -->
        <div class="footer-item">
          <svg class="footer-icon-svg" viewBox="0 0 24 24" style="color: #ef4444;">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span>더피티THEPT</span>
        </div>
        <!-- 홈페이지 -->
        <div class="footer-item">
          <svg class="footer-icon-stroke" viewBox="0 0 24 24" style="color: #38bdf8;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>thept.co.kr</span>
        </div>
      </div>

      <div class="carousel-dots">
        {{CAROUSEL_DOTS}}
      </div>

      <div class="swipe-action-text">
        <span>{{SWIPE_LABEL}}</span>
      </div>
    </div>
  </div>
</body>
</html>
