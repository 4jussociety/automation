<!-- 이 파일은 인스타그램 피드 4:5 최적 규격(1080x1350)의 카드뉴스 HTML 템플릿입니다. -->
<!-- 쇼츠 폼의 보도사진과 본문 구도를 유지하며, 상단 대형 로고와 하단 푸터를 제외하여 4:5 화면에 완벽 수납합니다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>THEPT Instagram Feed Card (4:5)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px; /* 인스타그램 피드 4:5 최적 규격 */
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #0b0f19;
    }

    .bg-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      background-image: url('{{BACKGROUND_IMAGE_DATA}}');
      background-size: cover;
      background-position: center;
      z-index: 0;
      filter: blur(2.5px) brightness(0.85);
      transform: scale(1.04);
    }

    .bg-overlay-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1350px;
      background: linear-gradient(
        180deg, 
        rgba(11, 15, 25, 0.94) 0%, 
        rgba(11, 15, 25, 0.72) 20%, 
        rgba(11, 15, 25, 0.65) 50%, 
        rgba(11, 15, 25, 0.88) 80%, 
        rgba(11, 15, 25, 0.98) 100%
      );
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 1080px;
      height: 1350px;
      padding: 40px 70px 45px 70px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* 1. 상단 슬림 방송형 헤더 */
    .broadcast-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding-top: 6px;
      padding-bottom: 12px;
    }

    .broadcast-date {
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.8px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .broadcast-subtitle {
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 4px;
      letter-spacing: -1.2px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
    }

    .broadcast-divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.25) 30%, rgba(255, 255, 255, 0.25) 70%, rgba(255, 255, 255, 0) 100%);
      margin-top: 14px;
    }

    /* 2. 중앙 메인 컨텐츠 영역 */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px 0 0 0;
    }

    /* [표지 슬라이드 (미디어 프레임 480px + 3개 뉴스 헤드라인)] */
    .cover-media-frame {
      width: 100%;
      height: 480px;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      position: relative;
      margin-bottom: 20px;
    }

    .cover-media-img {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    .cover-item-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cover-item-row {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 24px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      word-break: keep-all;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .cover-num-bullet {
      background: #facc15;
      color: #000000;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* [뉴스 상세 슬라이드] */
    .news-media-frame {
      width: 100%;
      height: 480px;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      margin-bottom: 20px;
      position: relative;
    }

    .news-media-img {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    .news-main-headline {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.38;
      letter-spacing: -1.2px;
      color: #ffffff;
      margin-bottom: 18px;
      word-break: keep-all;
      overflow-wrap: break-word;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.75);
    }

    .news-index-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #facc15;
      color: #000000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 28px;
      padding: 3px 14px;
      border-radius: 10px;
      margin-right: 12px;
      vertical-align: 3px;
      box-shadow: 0 4px 14px rgba(250, 204, 21, 0.35);
    }

    .news-source-inline {
      font-size: 28px;
      font-weight: 600;
      color: #94a3b8;
      margin-left: 10px;
      white-space: nowrap;
      display: inline-block;
      vertical-align: 2px;
      text-shadow: none;
    }

    .news-source-inline::before {
      content: "· ";
      color: #64748b;
      margin-right: 4px;
    }

    .news-glass-box {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 30px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    .news-body-bullet {
      font-size: 38px;
      line-height: 1.52;
      color: #f1f5f9;
      font-weight: 600;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .news-body-bullet:last-child {
      margin-bottom: 0;
    }

    /* [광고/프로모션 슬라이드 - 2분할 카드, 사진 제외형] */
    .ad-top-badge-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .ad-sponsor-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      color: #0f172a;
      font-size: 32px;
      font-weight: 900;
      padding: 4px 16px;
      border-radius: 8px;
      line-height: 1.15;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }

    .ad-split-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 10px;
      margin-bottom: 16px;
    }

    .ad-category-block {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      padding: 26px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ad-category-block.highlight {
      border-color: rgba(250, 204, 21, 0.5);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.94) 0%, rgba(30, 41, 59, 0.88) 100%);
    }

    .ad-cat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 14px;
    }

    .ad-cat-title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ad-cat-num {
      background: #facc15;
      color: #0f172a;
      font-size: 28px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(250, 204, 21, 0.35);
    }

    .ad-cat-name {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.8px;
      line-height: 1.25;
    }

    .ad-cat-tag {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 16px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .ad-cat-bullets {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ad-cat-bullet {
      font-size: 31px;
      line-height: 1.48;
      color: #f1f5f9;
      font-weight: 600;
    }

    .ad-hot-cta {
      background: linear-gradient(135deg, #facc15, #f59e0b);
      border-radius: 18px;
      padding: 20px 28px;
      font-size: 34px;
      font-weight: 900;
      color: #0f172a;
      text-align: center;
      margin-top: 14px;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
      letter-spacing: -0.5px;
    }

    /* [아웃트로 슬라이드] */
    .outro-card {
      background: rgba(15, 23, 42, 0.90);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      padding: 34px 38px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .outro-title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      letter-spacing: -1.2px;
    }

    .outro-sub {
      font-size: 36px;
      color: #cbd5e1;
      line-height: 1.55;
      font-weight: 600;
    }

    .outro-badges-row {
      display: flex;
      gap: 14px;
      margin-top: 8px;
    }

    .outro-badge-pill {
      background: rgba(250, 204, 21, 0.18);
      border: 1.5px solid #facc15;
      color: #fef08a;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 26px;
      font-weight: 800;
    }

    /* [하단 슬림 푸터: THEPT 브랜드 로고 + 밀어서 보기] */
    .card-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      margin-top: auto;
      padding-top: 8px;
    }

    .footer-divider {
      width: 100%;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.22) 30%, rgba(255, 255, 255, 0.22) 70%, rgba(255, 255, 255, 0) 100%);
      margin-bottom: 12px;
    }

    .footer-bar-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 2px 0;
    }

    .footer-thept-logo {
      height: 46px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="bg-image-layer"></div>
  <div class="bg-overlay-gradient"></div>

  <div class="container">
    <!-- 상단 슬림 방송형 헤더 -->
    <header class="broadcast-header">
      <div class="broadcast-date">{{DATE_TEXT}}</div>
      <div class="broadcast-subtitle">{{BROADCAST_SUBTITLE}}</div>
      <div class="broadcast-divider"></div>
    </header>

    <!-- 중앙 본문 슬라이드 (쇼츠와 100% 동일한 미디어 프레임 및 타이포그래피) -->
    <main class="main-body">
      {{BODY_CONTENT}}
    </main>

    <!-- 하단 슬림 푸터 (1, 5, 6페이지에만 THEPT 브랜드 로고 정중앙 노출, 뉴스 페이지 제외) -->
    <footer class="card-footer" style="{{FOOTER_STYLE}}">
      <div class="footer-divider"></div>
      <div class="footer-bar-inner">
        <img src="{{LOGO_DATA}}" class="footer-thept-logo" alt="THEPT">
      </div>
    </footer>
  </div>
</body>
</html>
