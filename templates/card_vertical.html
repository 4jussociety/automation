<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PT LAB Instagram & Reels Vertical Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px; /* 9:16 풀 세로형 (릴스/쇼츠/인스타 세로게시물 공용) */
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #0b0f19;
    }

    /* 내용 연관 고화질 배경 이미지 + 다크 그라디언트 오버레이 (아파트랩 스타일) */
    .bg-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background-image: url('{{BACKGROUND_IMAGE_DATA}}');
      background-size: cover;
      background-position: center;
      z-index: 0;
      filter: brightness(0.85);
    }

    .bg-overlay-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: linear-gradient(
        180deg, 
        rgba(11, 15, 25, 0.92) 0%, 
        rgba(11, 15, 25, 0.72) 25%, 
        rgba(11, 15, 25, 0.65) 50%, 
        rgba(11, 15, 25, 0.88) 75%, 
        rgba(11, 15, 25, 0.98) 100%
      );
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 1080px;
      height: 1920px;
      padding: 110px 80px 100px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. 상단 브랜딩 바 (아파트 LAP 로고 스타일) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 28px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 아파트 LAP 시그니처 볼드 사각 배지 */
    .lap-badge {
      background: #facc15; /* 아파트랩 특유의 형광 옐로우 골드 */
      color: #000000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 22px;
      padding: 8px 16px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .category-pill {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 8px 20px;
      border-radius: 9999px;
      font-size: 18px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    /* 2. 중앙 메인 컨텐츠 영역 */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0;
    }

    /* [표지 슬라이드 (Cover)] */
    .cover-tag-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(250, 204, 21, 0.15);
      border: 1.5px solid #facc15;
      color: #facc15;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 34px;
      width: fit-content;
    }

    .cover-huge-title {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.28;
      letter-spacing: -2px;
      color: #ffffff;
      margin-bottom: 36px;
      word-break: keep-all;
    }

    /* 키워드 강조용 컬러 클래스 */
    .hl-yellow {
      color: #facc15;
    }
    .hl-cyan {
      color: #38bdf8;
    }

    .cover-desc-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 26px;
      padding: 34px 40px;
      margin-bottom: 40px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .cover-desc-text {
      font-size: 26px;
      font-weight: 600;
      color: #cbd5e1;
      line-height: 1.55;
      word-break: keep-all;
    }

    .cover-item-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .cover-item-row {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 25px;
      font-weight: 700;
      color: #f8fafc;
      backdrop-filter: blur(12px);
    }

    .cover-num-bullet {
      background: #facc15;
      color: #000000;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* [뉴스 상세 슬라이드 (News)] */
    .news-top-badge-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .news-index-badge {
      background: #facc15;
      color: #000000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 24px;
      padding: 6px 18px;
      border-radius: 12px;
    }

    .news-category-badge {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 19px;
      font-weight: 800;
    }

    .news-source-badge {
      color: #94a3b8;
      font-size: 19px;
      font-weight: 600;
    }

    .news-main-headline {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.32;
      letter-spacing: -1.5px;
      color: #ffffff;
      margin-bottom: 38px;
      word-break: keep-all;
    }

    .news-glass-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 26px;
      padding: 38px 40px;
      margin-bottom: 32px;
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .news-body-bullet {
      font-size: 27px;
      line-height: 1.65;
      color: #e2e8f0;
      font-weight: 500;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .news-body-bullet:last-child {
      margin-bottom: 0;
    }

    .news-action-highlight {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.18) 0%, rgba(234, 179, 8, 0.08) 100%);
      border: 1.5px solid #facc15;
      border-radius: 20px;
      padding: 28px 34px;
      font-size: 25px;
      font-weight: 800;
      color: #fef08a;
      line-height: 1.5;
      word-break: keep-all;
      box-shadow: 0 8px 25px rgba(250, 204, 21, 0.15);
    }

    /* [인사이트 슬라이드] */
    .insight-top-tag {
      background: rgba(56, 189, 248, 0.18);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 28px;
      width: fit-content;
    }

    .insight-huge-title {
      font-size: 54px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.32;
      letter-spacing: -1.5px;
      margin-bottom: 34px;
      word-break: keep-all;
    }

    .insight-summary-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 36px 40px;
      font-size: 27px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 32px;
      backdrop-filter: blur(16px);
      word-break: keep-all;
    }

    .insight-checklist {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .insight-check-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      backdrop-filter: blur(12px);
    }

    /* [아웃트로 슬라이드 (Outro)] */
    .outro-card-box {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(250, 204, 21, 0.5);
      border-radius: 36px;
      padding: 60px 48px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .outro-lap-pill {
      background: #facc15;
      color: #000000;
      font-weight: 900;
      font-size: 20px;
      padding: 8px 24px;
      border-radius: 9999px;
      margin-bottom: 32px;
    }

    .outro-header-text {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .outro-sub-text {
      font-size: 27px;
      color: #94a3b8;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 50px;
      word-break: keep-all;
    }

    /* 실제 인스타그램 인터랙션 버튼 4개 */
    .outro-insta-buttons {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-bottom: 44px;
    }

    .insta-button {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      padding: 22px 14px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      backdrop-filter: blur(10px);
    }

    .insta-button.highlight-save {
      background: rgba(250, 204, 21, 0.2);
      border-color: #facc15;
      color: #fef08a;
    }

    .btn-icon {
      font-size: 32px;
    }

    .outro-channel-tag {
      font-size: 24px;
      font-weight: 900;
      color: #facc15;
    }

    /* 3. 하단 네비게이션 및 스와이프 안내 */
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid rgba(255, 255, 255, 0.15);
      padding-top: 30px;
    }

    .nav-account {
      font-size: 22px;
      font-weight: 800;
      color: #94a3b8;
    }

    /* 캐러셀 인디케이터 점 (● ○ ○ ○ ○ ○) */
    .carousel-dots {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
    }

    .dot.active {
      width: 32px;
      height: 12px;
      border-radius: 9999px;
      background: #facc15;
      box-shadow: 0 0 12px #facc15;
    }

    .swipe-action-text {
      font-size: 22px;
      font-weight: 900;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <!-- 배경 이미지 및 다크 그라디언트 레이어 -->
  <div class="bg-image-layer"></div>
  <div class="bg-overlay-gradient"></div>

  <div class="container">
    <!-- 상단 브랜딩 바 -->
    <div class="top-bar">
      <div class="brand-wrap">
        <div class="lap-badge">PT LAP</div>
        <div class="brand-title">물리치료 LAB</div>
      </div>
      <div class="category-pill">{{HEADER_TAG}}</div>
    </div>

    <!-- 중앙 본문 슬라이드 -->
    <div class="main-body">
      {{BODY_CONTENT}}
    </div>

    <!-- 하단 인스타그램 네비게이션 바 -->
    <div class="bottom-nav">
      <div class="nav-account">@pt_lap</div>
      <div class="carousel-dots">
        {{CAROUSEL_DOTS}}
      </div>
      <div class="swipe-action-text">
        <span>{{SWIPE_LABEL}}</span>
      </div>
    </div>
  </div>
</body>
</html>
