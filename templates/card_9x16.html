<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>THEPT Reels & Shorts Vertical Card (9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px; /* 9:16 풀 세로형 */
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #0b0f19;
    }

    .bg-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background-image: url('{{BACKGROUND_IMAGE_DATA}}');
      background-size: cover;
      background-position: center;
      z-index: 0;
      filter: brightness(0.85);
    }

    .bg-overlay-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: linear-gradient(
        180deg, 
        rgba(11, 15, 25, 0.94) 0%, 
        rgba(11, 15, 25, 0.72) 20%, 
        rgba(11, 15, 25, 0.65) 50%, 
        rgba(11, 15, 25, 0.88) 80%, 
        rgba(11, 15, 25, 0.98) 100%
      );
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 1080px;
      height: 1920px;
      padding: 100px 80px 90px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. 상단 브랜딩 바 (THEPT 로고) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 26px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .thept-logo-img {
      height: 68px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.7));
    }

    .brand-sub {
      font-size: 32px;
      font-weight: 800;
      color: #e2e8f0;
      border-left: 3px solid rgba(255, 255, 255, 0.35);
      padding-left: 20px;
      letter-spacing: -0.5px;
    }

    .category-pill {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 28px;
      font-weight: 800;
      backdrop-filter: blur(16px);
    }

    /* 2. 중앙 메인 컨텐츠 영역 */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0;
    }

    /* 투명 배경 모드 (쇼츠 비디오 오버레이 렌더링용) */
    body.transparent-bg {
      background: transparent !important;
      background-color: transparent !important;
    }
    body.transparent-bg .bg-image-layer,
    body.transparent-bg .bg-overlay-gradient {
      display: none !important;
    }

    /* [표지 슬라이드] */
    .cover-tag-box {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(250, 204, 21, 0.25);
      border: 3px solid #facc15;
      color: #facc15;
      padding: 16px 34px;
      border-radius: 18px;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 40px;
      width: fit-content;
      box-shadow: 0 8px 24px rgba(250, 204, 21, 0.35);
    }

    .cover-huge-title {
      font-size: 82px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -2.4px;
      color: #ffffff;
      margin-bottom: 42px;
      word-break: keep-all;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.85);
    }

    .hl-yellow {
      color: #facc15;
      text-shadow: 0 0 35px rgba(250, 204, 21, 0.5);
    }

    .cover-desc-card {
      background: rgba(15, 23, 42, 0.90);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      padding: 38px 46px;
      margin-bottom: 42px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5);
    }

    .cover-desc-text {
      font-size: 38px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.5;
      word-break: keep-all;
    }

    .cover-item-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .cover-item-row {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      padding: 24px 34px;
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.45;
      word-break: keep-all;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .cover-num-bullet {
      background: #facc15;
      color: #000000;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* [뉴스 상세 슬라이드] */
    .news-top-badge-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 34px;
    }

    .news-index-badge {
      background: #facc15;
      color: #000000;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 34px;
      padding: 10px 24px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.4);
    }

    .news-category-badge {
      background: rgba(56, 189, 248, 0.25);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 11px 26px;
      border-radius: 14px;
      font-size: 32px;
      font-weight: 800;
    }

    .news-source-badge {
      color: #e2e8f0;
      font-size: 28px;
      font-weight: 700;
    }

    .news-main-headline {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -2px;
      color: #ffffff;
      margin-bottom: 40px;
      word-break: keep-all;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.85);
    }

    .news-glass-box {
      background: rgba(15, 23, 42, 0.90);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      padding: 44px 48px;
      margin-bottom: 38px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.5);
    }

    .news-body-bullet {
      font-size: 38px;
      line-height: 1.65;
      color: #ffffff;
      font-weight: 600;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .news-body-bullet:last-child {
      margin-bottom: 0;
    }

    .news-action-highlight {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.28) 0%, rgba(234, 179, 8, 0.16) 100%);
      border: 2.5px solid #facc15;
      border-radius: 26px;
      padding: 34px 44px;
      font-size: 38px;
      font-weight: 800;
      color: #fef08a;
      line-height: 1.5;
      word-break: keep-all;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    /* [인사이트 슬라이드] */
    .insight-top-tag {
      background: rgba(56, 189, 248, 0.25);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 12px 28px;
      border-radius: 16px;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 32px;
      width: fit-content;
    }

    .insight-huge-title {
      font-size: 66px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.3;
      letter-spacing: -1.8px;
      margin-bottom: 38px;
      word-break: keep-all;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.85);
    }

    .insight-summary-card {
      background: rgba(15, 23, 42, 0.90);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 40px 46px;
      font-size: 38px;
      line-height: 1.6;
      color: #ffffff;
      font-weight: 600;
      margin-bottom: 38px;
      backdrop-filter: blur(24px);
      word-break: keep-all;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }

    .insight-checklist {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .insight-check-item {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* [아웃트로 슬라이드] */
    .outro-card-box {
      background: rgba(15, 23, 42, 0.94);
      border: 3.5px solid rgba(250, 204, 21, 0.7);
      border-radius: 42px;
      padding: 66px 52px;
      text-align: center;
      backdrop-filter: blur(28px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .outro-header-text {
      font-size: 66px;
      font-weight: 900;
      line-height: 1.32;
      color: #ffffff;
      margin-bottom: 26px;
      word-break: keep-all;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.85);
    }

    .outro-sub-text {
      font-size: 36px;
      color: #e2e8f0;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 50px;
      word-break: keep-all;
    }

    .outro-insta-buttons {
      display: flex;
      gap: 20px;
      width: 100%;
      margin-bottom: 44px;
    }

    .insta-button {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.25);
      padding: 28px 20px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      backdrop-filter: blur(16px);
    }

    .insta-button.highlight-save {
      background: rgba(250, 204, 21, 0.28);
      border-color: #facc15;
      color: #fef08a;
    }

    .btn-icon {
      font-size: 44px;
    }

    .outro-channel-tag {
      font-size: 30px;
      font-weight: 900;
      color: #facc15;
    }

    /* 3. 하단 네비게이션 및 채널 3종 바 (2단 개편) */
    .bottom-nav {
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      padding-top: 24px;
    }

    /* 1행: 채널 3종 바 (한 줄 꽉 차게 균등 분할) */
    .footer-channels-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 16px;
    }

    .footer-channel-badge {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      padding: 16px 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .footer-channel-badge span {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    .footer-icon-svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .footer-icon-stroke {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.3;
      flex-shrink: 0;
    }

    /* 2행: 최하단 인디케이터 및 스와이프 액션 */
    .footer-bottom-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 6px;
    }

    .carousel-dots {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }

    .dot.active {
      width: 36px;
      height: 13px;
      border-radius: 9999px;
      background: #facc15;
      box-shadow: 0 0 14px #facc15;
    }

    .swipe-action-text {
      font-size: 26px;
      font-weight: 900;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="bg-image-layer"></div>
  <div class="bg-overlay-gradient"></div>

  <div class="container">
    <!-- 상단 브랜딩 바 -->
    <div class="top-bar">
      <div class="brand-wrap">
        <img src="{{LOGO_DATA}}" class="thept-logo-img" alt="THEPT Logo" />
        <div class="brand-sub">물리치료 LAB</div>
      </div>
      <div class="category-pill">{{HEADER_TAG}}</div>
    </div>

    <!-- 중앙 본문 슬라이드 -->
    <div class="main-body">
      {{BODY_CONTENT}}
    </div>

    <!-- 하단 네비게이션 및 채널 3종 바 (2단 구성) -->
    <div class="bottom-nav">
      <!-- 1행: 채널 3종 바 (한 줄 꽉 차게) -->
      <div class="footer-channels-bar">
        <!-- 인스타그램 -->
        <div class="footer-channel-badge">
          <svg class="footer-icon-stroke" viewBox="0 0 24 24" style="color: #f43f5e;">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>@teamthept</span>
        </div>
        <!-- 유튜브 -->
        <div class="footer-channel-badge">
          <svg class="footer-icon-svg" viewBox="0 0 24 24" style="color: #ef4444;">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span>더피티THEPT</span>
        </div>
        <!-- 홈페이지 -->
        <div class="footer-channel-badge">
          <svg class="footer-icon-stroke" viewBox="0 0 24 24" style="color: #38bdf8;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>thept.co.kr</span>
        </div>
      </div>

      <!-- 2행: 최하단 인디케이터 점들과 다음장으로 라벨 -->
      <div class="footer-bottom-action-bar">
        <div class="carousel-dots">
          {{CAROUSEL_DOTS}}
        </div>
        <div class="swipe-action-text">
          <span>{{SWIPE_LABEL}}</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
