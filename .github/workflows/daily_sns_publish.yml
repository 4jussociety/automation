name: Daily SNS Auto-Publish (Instagram & YouTube)

on:
  schedule:
    # 매일 UTC 23:00 실행 (한국 시간 KST 오전 08:00)
    # 일~금 UTC 23:00 = 월~토 KST 08:00 (주 6일 정기 발행)
    - cron: '0 23 * * 0-5'

  # GitHub 웹 화면(Actions 탭)에서 언제든 원클릭 수동 즉시 실행 지원
  workflow_dispatch:

jobs:
  publish-sns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube Token Credentials
        env:
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > token.pickle
            echo "✅ YouTube token.pickle restored successfully."
          fi
          if [ -n "$YOUTUBE_CLIENT_SECRET_BASE64" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_BASE64" | base64 --decode > client_secret.json
            echo "✅ YouTube client_secret.json restored successfully."
          fi

      - name: Publish Today's Content (Instagram + YouTube)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python curate.py upload --platform all --today-only
