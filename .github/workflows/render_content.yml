name: Render Weekly Issue Pipeline

on:
  push:
    paths:
      - 'contents/**.json'
  workflow_dispatch:
    inputs:
      draft:
        description: '렌더링할 대본 JSON 파일 경로 (비워둘 시 가장 최신 대본 자동 선택)'
        required: false
        default: ''
      skip_video:
        description: '비디오 렌더링 건너뛰기 여부'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  render-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pipeline (Render Media from Latest Weekly Issue Draft)
        run: |
          CMD="python main.py"
          if [ -n "${{ github.event.inputs.draft }}" ]; then
            CMD="$CMD --draft \"${{ github.event.inputs.draft }}\""
          fi
          if [ "${{ github.event.inputs.skip_video }}" = "true" ]; then
            CMD="$CMD --skip-video"
          fi
          echo "실행 명령어: $CMD"
          eval $CMD

      - name: Upload Output Artifacts (Card News & Shorts)
        uses: actions/upload-artifact@v4
        with:
          name: team-the-pt-weekly-issue-output
          path: output/
          retention-days: 7

      - name: Commit Updated History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update weekly issue history [skip ci]" && git push)
