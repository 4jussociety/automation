name: Daily Instagram Auto-Publish

on:
  schedule:
    # 매일 UTC 23:00 실행 (한국 시간 KST 오전 08:00)
    # 일~금 UTC 23:00 = 월~토 KST 08:00 (주 6일 정기 발행)
    - cron: '0 23 * * 0-5'

  # GitHub 웹 화면(Actions 탭)에서 언제든 원클릭 수동 실행 지원
  workflow_dispatch:

jobs:
  publish-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish Today's Instagram Content
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python curate.py upload --platform instagram --today-only
